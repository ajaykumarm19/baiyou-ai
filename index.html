<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Baiyou AI</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="app">

<header class="topbar">

  <div class="brand">
    <div class="logo">🐶</div>
    <div>
      <h1>Baiyou AI</h1>
      <p>Your personal AI assistant</p>
    </div>
  </div>

  <button id="newChat">
    ＋ New
  </button>

</header>


<main id="chat">

  <div class="message ai welcome">
    <h2>👋 Hello!</h2>
    <p>
      I'm <b>Baiyou AI</b>.<br>
      Your intelligent and friendly AI assistant.
    </p>

    <span>
      Ask me anything...
    </span>
  </div>

</main>


<footer class="bottom">

  <textarea
    id="prompt"
    rows="1"
    placeholder="Message Baiyou AI..."
  ></textarea>

  <button id="send">
    ➤
  </button>

</footer>

</div>


<script src="/app.js"></script>

</body>
</html>
