<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baiyou AI</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>

<body>

<header class="topbar">
  <div class="logo">
    🐶 Baiyou AI
  </div>

  <button id="newChat">New Chat</button>
</header>

<main id="chat">

  <div class="message ai">
    Hello! I'm <b>Baiyou AI</b>.<br><br>
    How can I help you today?
  </div>

</main>

<footer class="bottom">

  <textarea
      id="prompt"
      placeholder="Message Baiyou AI..."
  ></textarea>

  <button id="send">
    Send
  </button>

</footer>

<script src="/app.js"></script>

</body>
</html>
